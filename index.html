<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: black;
            color: white;
        }
        #boxPw{
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="boxPw">
        <!-- Formular, return false verhindert neu laden -->
        <form onsubmit="checkpasswort(); return false;"> 
            <label for="pw">Enter Password</label><br>
            <input type="password" id="pw" placeholder="Passwort" required autofocus minlength="3">

            <p id="messagePw"></p>
            <!-- <button onclick="checkpasswort()">Login</button> -->
        </form>
    </div>
    <script>
        function checkpasswort(){        
            const correctPw = "619"
            const input = document.getElementById("pw").value;

            if (input == correctPw){
                window.location.href = "CSSWebsite.html";
            } else {
                document.getElementById("messagePw").textContent = "Falsches Passwort!"
            }}
    </script>
</body>
</html>
